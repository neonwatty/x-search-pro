<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/x-search-pro/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Search Pro - Save & Organize Your X/Twitter Searches</title>
    <meta name="description" content="Build a library of powerful X/Twitter searches with auto-updating date ranges. Find viral content instantly with this free Chrome extension." />
    <script>
      // Handle SPA routing for GitHub Pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
